[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "volsegtools"
version = "0.0.0"
authors = [
]
description = ""
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "dask",
    "dask_image",
    "zarr",
    "numpy",
    "mrcfile",
    "nibabel",
    "pydantic",
    "typer",
    "ciftools",
]

[tool.setuptools]
packages = [
    "volsegtools",
    "volsegtools.core",
    "volsegtools.model",
    "volsegtools.downsampler",
    "volsegtools.converter",
    "volsegtools.abc",
    "volsegtools.preprocessor",
    "volsegtools.serialization",
    "volsegtools._cli", # FIX: this shouldn't be exported
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
molstar-preprocessor = 'volsegtools._cli:PreprocessorApp'
