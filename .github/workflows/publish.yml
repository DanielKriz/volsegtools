name: Volsegtools publish package workflow

# Run this action only if a new version (with a tag) comes out.
on:
  push:
    tags: ["[0-9].[0-9]+.[0-9]+"]

jobs:
  checks:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/checks.yml

  build:
    name: Build package distributions
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - checks

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Build wheel and source distributions
        run: uv build
      - name: Validate distributions
        run: uvx --from twine twine check --strict dist/*
      - name: Upload distributions artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-distribution
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Upload new release to PyPI
    runs-on: ubuntu-latest
    needs:
      - build
    environment:
      name: pypi
      url: https://pypi.org/p/volsegtools
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-distribution
          path: dist/
      - name: Verify distributions locally
        if: ${{ env.ACT }}
        run: |
          ls -la dist
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Publish package distributions to PyPI
        if: ${{ !env.ACT }}
        uses: pypa/gh-action-pypi-publish@release/v1
